<!DOCTYPE html>
<html>
<head>

    <title>Keep Going ❤️</title>

    <style>

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        .box {
            padding: 40px;
            background: rgba(255,255,255,0.15);
            border-radius: 25px;
            width: 80%;
            max-width: 500px;
        }

        button {
            padding: 15px 25px;
            margin: 10px;
            border: none;
            border-radius: 25px;
            font-size: 17px;
        }

        .correct {
            background: white;
            color: #764ba2;
            cursor: pointer;
        }

        .wrong {
            background: #777;
            color: white;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>You're still here? 👀</h1>

    <p>Okay... let's make this interesting.</p>

    <h2>Choose one ❤️</h2>

    <button class="wrong" disabled>
        Go Back
    </button>

    <button class="correct"
        onclick="location.href='final.html'">
        Open This ❤️
    </button>

    <button class="wrong" disabled>
        Something Else
    </button>

</div>

</body>
</html>
